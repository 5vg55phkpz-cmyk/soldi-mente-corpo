<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Pagina non trovata | Immobiliare eMMe due</title>
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <style>
      @font-face { font-family: 'Poppins'; font-weight: 400; src: url('/vendor/fonts/poppins-latin-400-normal.woff2') format('woff2'); font-display: swap; }
      @font-face { font-family: 'Poppins'; font-weight: 600; src: url('/vendor/fonts/poppins-latin-600-normal.woff2') format('woff2'); font-display: swap; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: 'Poppins', system-ui, sans-serif; color: #f4f6fa; text-align: center;
        background: linear-gradient(140deg, #2d6cc0 0%, #14294a 60%, #0e1d33 100%);
      }
      main { max-width: 520px; }
      .code { font-size: 96px; font-weight: 600; line-height: 1; color: #ffb3ad; margin: 0; }
      h1 { font-size: 28px; font-weight: 600; margin: 16px 0 8px; }
      p { line-height: 1.7; color: #c9d6ea; margin: 0 0 28px; }
      a.btn { display: inline-block; padding: 14px 28px; border-radius: 999px; background: #fff; color: #14294a; font-weight: 600; text-decoration: none; }
      a.btn:focus-visible { outline: 2px solid #ffb3ad; outline-offset: 3px; }
      .tel { display: block; margin-top: 18px; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Pagina non trovata</h1>
      <p>La pagina che cerchi non esiste o è stata spostata. L'immobile potrebbe essere già stato venduto o affittato.</p>
      <a class="btn" href="/">Torna agli immobili</a>
      <a class="tel" href="tel:+390598723629">oppure chiamaci: 059.8723629</a>
    </main>
  </body>
</html>
